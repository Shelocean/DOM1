<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto DOM</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <main>
        <section>
            <form action="">
                <h3>Primer Ejercicio DOM</h3>

                <label for="nombre">Nombre: </label>
                <input type="text" id="nombre" placeholder="Ingresar Nombre">

                <br>
                <input type="text" id="resultado">

                <button type="button" onclick="saludar()">Aceptar</button>
                <button type="reset">Cancelar</button>
            </form>
        </section>

        <section> 
            <h3>Segundo Ejercicio DOM</h3>

            <form action="">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre2"> 
                <label for="programa2">Programa de formación:</label>
                <input type="text" id="programa2">
                <button onclick="registrar()" type="button">Registar</button>
            </form>

            <h2>Resultados</h2>

            <p>Resultado en un input:</p>
            <input type="text" id="resultado11" readonly>
            <p id="resultado22">Resultado con innerText:</p>
            <p id="resultado33">Resultado con innerHTML:</p>
            <p id="resultado44">Resultado con innerContent:</p>
        </section>

        <section>
            <form action="">
                <h3>Tercer Ejercicio DOM: operaciones numéricas</h3>

                <label for="valor1">valor 1: </label>
                <input type="text" id="valor1" placeholder="Ej: 15.8">

                <label for="valor2">valor 2: </label>
                <input type="text" id="valor2" placeholder="Ej: 4.25">
                <br>

                <button type="button" onclick="calcularOperaciones()">Calcular</button>
                <button type="reset">Cancelar</button>
            </form>

            <h2>Resultados</h2>

            <p>Con parseInt(): <span id="resParseInt"></span></p>
            <p>Con parseFloat(): <span id="resParseFloat"></span></p>
            <p>Con Number(): <span id="resNumber"></span></p>
            <p>Suma usando parseFloat(): <span id="resSuma"></span></p>
        </section>
    </main>

    <script src="JS/script.js"></script>
</body>
</html>
